---
deployment:
  tasks:
    - export DEPLOYPATH=/home/rexkelly/public_html
    - /bin/cp -R * $DEPLOYPATH/
    - /bin/cp -R .next $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp .env $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp .env.local $DEPLOYPATH/ 2>/dev/null || true
    - cd $DEPLOYPATH && /usr/local/bin/npm install --legacy-peer-deps 2>/dev/null || cd $DEPLOYPATH && npm install --legacy-peer-deps
    - cd $DEPLOYPATH && /usr/local/bin/npm run build 2>/dev/null || cd $DEPLOYPATH && npm run build
