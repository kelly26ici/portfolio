---
deployment:
  tasks:
    - export DEPLOYPATH=/home/rexkelly/portfolio
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH/
    - /bin/cp .env $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp .env.local $DEPLOYPATH/ 2>/dev/null || true
    - cd $DEPLOYPATH && /usr/local/bin/npm install --omit=dev --legacy-peer-deps 2>/dev/null || cd $DEPLOYPATH && npm install --omit=dev --legacy-peer-deps
