name: Build & Deploy to HostKenya (cPanel)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Next.js & FTP Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js 20 ───────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install all dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── 4. Build Next.js ───────────────────────────────────────────────────
      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # ── 5. Clean up node_modules & cache to ensure lightning fast FTP ──────
      - name: Clean up heavy non-production files
        run: |
          rm -rf node_modules
          rm -rf .next/cache
          mkdir -p tmp
          touch tmp/restart.txt

      # ── 6. FTP Deploy ──────────────────────────────────────────────────────
      - name: Deploy via FTP to portfolio directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: portfolio/
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.agent/**
            **/node_modules/**
            **/coverage/**
            **/docs/**
            **/*.log
            **/README.md
            **/CHECKPOINT.md

      # ── 7. Summary ─────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅  Build + Deploy complete"
          echo "    Pre-built .next/, server.js, app.js deployed"
          echo "    Passenger restart triggered via tmp/restart.txt"
          echo "    Commit : ${{ github.sha }}"
          echo "    Branch : ${{ github.ref_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
