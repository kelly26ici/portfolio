name: Build & Deploy to HostKenya (cPanel)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Next.js & FTP Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js 20 ───────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install all dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── 4. Build Next.js (needs RAM — done here, NOT on the server) ────────
      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # ── 5. Prune to production deps only (smaller upload) ─────────────────
      - name: Prune to production dependencies
        run: npm prune --production --legacy-peer-deps

      # ── 6. FTP Deploy — uploads everything including pre-built .next/ ──────
      #
      #  The server NEVER needs to run `npm run build` — the built .next/
      #  folder is uploaded here. Server only runs `next start` via server.js.
      #
      #  Add these 3 secrets in GitHub → Settings → Secrets → Actions:
      #    FTP_HOST      → HostKenya FTP hostname (e.g. ftp.yoursite.com)
      #    FTP_USERNAME  → your cPanel username  (rexkelly)
      #    FTP_PASSWORD  → your cPanel password
      # ────────────────────────────────────────────────────────────────────────
      - name: Deploy via FTP to /portfolio directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /portfolio/
          exclude: |
            **/.git*
            **/.git*/**
            **/coverage/**
            **/*.log
            **/tmp/**

      # ── 7. Summary ─────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅  Build + Deploy complete"
          echo "    .next/ folder uploaded — server runs next start"
          echo "    Commit : ${{ github.sha }}"
          echo "    Branch : ${{ github.ref_name }}"
          echo "    Actor  : ${{ github.actor }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
