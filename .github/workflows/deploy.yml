name: Build & Deploy to HostKenya (cPanel)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Next.js & FTP Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js 20 ───────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install all dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── 4. Build Next.js ───────────────────────────────────────────────────
      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # ── 5. Prepare standalone bundle (standalone output requires manual copy) ──
      - name: Prepare standalone deployment bundle
        run: |
          # Next.js standalone output does NOT auto-copy public/ or .next/static/
          # These must be manually placed inside .next/standalone/
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          # Remove heavy non-essential files (keep standalone bundle intact)
          rm -rf .next/cache
          # Passenger restart trigger
          mkdir -p tmp
          touch tmp/restart.txt


      # ── 6. FTP Deploy ──────────────────────────────────────────────────────
      - name: Deploy via FTP to portfolio directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: portfolio/
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/coverage/**
            **/*.log
            **/README.md
            **/CHECKPOINT.md


      # ── 7. Summary ─────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅  Build + Deploy complete"
          echo "    Pre-built .next/, server.js, app.js deployed"
          echo "    Passenger restart triggered via tmp/restart.txt"
          echo "    Commit : ${{ github.sha }}"
          echo "    Branch : ${{ github.ref_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
